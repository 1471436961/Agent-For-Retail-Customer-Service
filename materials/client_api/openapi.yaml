                      "items": {
                        "$ref": "#/components/schemas/OrderItem"
                      },
                      "title": "Items",
                      "type": "array"
                    },
                    "status": {
                      "enum": [
                        "processed",
                        "pending",
                        "pending (items modified)",
                        "delivered",
                        "cancelled",
                        "exchange requested",
                        "return requested"
                      ],
                      "title": "Status",
                      "type": "string"
                    },
                    "fulfillments": {
                      "items": {
                        "$ref": "#/components/schemas/OrderFulfillment"
                      },
                      "title": "Fulfillments",
                      "type": "array"
                    },
                    "payments": {
                      "items": {
                        "$ref": "#/components/schemas/OrderPayment"
                      },
                      "title": "Payments",
                      "type": "array"
                    },
                    "cancellation": {
                      "anyOf": [
                        {
                          "$ref": "#/components/schemas/OrderCancellation"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "exchange": {
                      "anyOf": [
                        {
                          "$ref": "#/components/schemas/OrderExchange"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "return_request": {
                      "anyOf": [
                        {
                          "$ref": "#/components/schemas/OrderReturn"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    }
                  },
                  "required": [
                    "order_id",
                    "customer_id",
                    "shipping_address",
                    "items",
                    "status",
                    "fulfillments",
                    "payments"
                  ],
                  "title": "Order",
                  "type": "object"
                }
              }
            }
          },
